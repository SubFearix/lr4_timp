server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Проксирование API на бэкенд-контейнер. Префикс /api/ срезается,
    # так как маршруты FastAPI объявлены без него (/login, /objects, ...).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любой путь без совпадения с файлом отдаёт index.html,
    # чтобы работал клиентский роутинг react-router.
    location / {
        try_files $uri /index.html;
    }
}
